<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- CRP logo as the browser icon, on every page of the programme.
       Served from raw.githubusercontent so all pages can share one identical URL
       regardless of their path; the GitHub blob URL redirects twice to reach the
       file. Declaring it also stops the browser's automatic /favicon.ico
       request, which 404s on GitHub Pages and shows as a console error. -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/CRP-company/CRP-early-access/main/assets/CRPlogo.png">
  <title>CRP · Tester dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tester.css">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <!-- Sign in ------------------------------------------------------------ -->
  <section id="login-view" class="login">
    <form id="login-form" class="login__card" novalidate>
      <img class="badge" src="https://github.com/CRP-company/CRP-early-access/blob/main/assets/CRPlogo.png?raw=true" alt="CRP Logo">
      <h1>Tester dashboard</h1>
      <p class="muted">
        Sign in with the email and password you use for CRP Focus.
      </p>

      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>

      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn--block" id="login-submit">Sign in</button>

      <p id="login-error" class="alert alert--error" role="alert" hidden></p>

      <!-- Shown when the address is on the roster but has no CRP Focus
           password yet. Replaces the password form rather than sitting beneath
           it, so there is one obvious next action. -->
      <div id="no-password" hidden>
        <p class="alert alert--info">
          No CRP Focus password for <strong id="no-password-email"></strong> yet.
          Create one now — it is the same account you use in the app.
        </p>
        <label for="new-password">Create a password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="6">
        <label for="new-password-confirm">Confirm password</label>
        <input id="new-password-confirm" type="password" autocomplete="new-password" minlength="6">
        <button type="button" class="btn btn--block" id="create-password">Create password</button>
      </div>
    </form>
  </section>



  <!-- Dashboard ---------------------------------------------------------- -->
  <main id="app-view" class="wrap" hidden>
    <header class="topbar">
      <div>
        <span class="badge">CRP · TESTER</span>
        <h1 id="tester-name">Welcome back</h1>
        <p class="muted" id="tester-meta"></p>
      </div>
      <button id="sign-out" class="btn btn--ghost">Sign out</button>
    </header>

    <!-- "This month" and "Your requests" share a row; the new-request form sits
         below them. -->
    <div class="card-row">
      <section class="card">
        <div class="card__head">
          <h2>This month</h2>
          <span class="target" id="target-text"></span>
        </div>
        <!-- One card per request, under the heading. Grey for a slot still to
             fill, green for the monthly minimum met, blue for anything beyond
             it. Populated by renderTarget(). -->
        <div class="request-slots" id="request-slots" role="img"></div>
      </section>

      <section class="card">
        <div class="card__head">
          <h2>Your requests</h2>
          <span class="pill" id="feedback-count">0</span>
        </div>
        <div id="feedback-list"></div>
      </section>
    </div>

    <section class="card">
      <div class="card__head">
        <h2>New request</h2>
        <span class="pill pill--ok" id="can-submit">Open</span>
      </div>

      <form id="feedback-form" novalidate>

        <label for="feedback-area">What is it about?</label>
        <select id="feedback-area" required>
          <option value="">Choose one…</option>
          <option value="app">CRP Focus</option>
          <option value="hardware">Cuby device</option>
          <option value="other">Something else</option>
        </select>

        <label for="feedback-title">request title</label>
        <input id="feedback-title" type="text" maxlength="120" placeholder="Add a dark mode" required>

        <label for="feedback-body">Tell us more</label>
        <textarea id="feedback-body" maxlength="2000" placeholder="What you were trying to do, and what would be better." required></textarea>

        <button type="submit" class="btn" id="feedback-submit">Send request</button>
        <p id="feedback-error" class="alert alert--error" role="alert" hidden></p>
        <p id="feedback-done" class="alert alert--info" role="status" hidden></p>
      </form>

      <!-- Shown instead of the form when the tester is not currently active. -->
      <div id="feedback-blocked" class="alert alert--error" hidden></div>
    </section>

    <p class="footer">©2026 CRP. Tester program.</p>
  </main>

  <!-- Worker endpoint. Public — it is a URL, not a credential. The Firebase ID
       token travels in the Authorization header, and the Resend and
       service-account keys never leave the Worker. -->
  <script src="js/worker-config.js"></script>
  <script type="module" src="js/tester.js"></script>
</body>
</html>
